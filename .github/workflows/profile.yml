name: profile

on:
  schedule:
    - cron: '17 1 * * *'   # daily, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the pulse card and activity
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4F7A00&color_dots=#ECE6DA,#C9DE9E,#9FC254,#72A112,#4F7A00
            dist/snake-dark.svg?color_snake=#C8F169&color_dots=#24221E,#3B4A1E,#5E7F23,#93C23F,#C8F169

      - name: Publish the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'snake: redraw'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git diff --cached --quiet || git commit -m 'profile: daily rebuild'
          git push
