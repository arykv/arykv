<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-label="aryan rao. product engineer. now building rally.">
  <style>
    .name { font: 600 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -0.8px; fill: #E6EDF3; }
    .line { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #7D8590; }
    .k { font: 400 12.5px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #7D8590; }
    .v { font: 400 12.5px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #E6EDF3; }
    .live { font: 400 12px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #7D8590; }
    .dot { fill: #3FB950; }
    .ring { fill: none; stroke: #3FB950; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7 } 80%, 100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0 } }
  </style>
  <text x="0" y="44" class="name">aryan rao</text>
  <text x="0" y="74" class="line">product engineer. i ship the whole thing.</text>
  <circle cx="619" cy="36" r="3.5" class="ring"/>
  <circle cx="619" cy="36" r="3.5" class="dot"/>
  <text x="632" y="40" class="live">shipping</text>
  <line x1="0" y1="112" x2="720" y2="112" stroke="#30363D"/>
  <text x="0" y="152" class="k">now</text><text x="104" y="152" class="v">rally — ratings for the people you actually play with</text>
  <text x="0" y="178" class="k">before</text><text x="104" y="178" class="v">all nighter — every ncert chapter, the night before</text>
  <text x="0" y="204" class="k">stack</text><text x="104" y="204" class="v">typescript, react native, next.js, supabase, swift</text>
  <text x="0" y="230" class="k">last ship</text><text x="104" y="230" class="v">24 oct 2026</text>
</svg>
