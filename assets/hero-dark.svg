<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Aryan Rao — i ship the whole thing.">
  <defs>
    <filter id="blur-dark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain-dark"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .08 0"/></filter>
    <clipPath id="card-dark"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>
  <style>
    .name { font: 650 104px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -4px; fill: #F5F5F4; }
    .typed { font: 400 20px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #8A8A86; }
    .pill { font: 500 13px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .4px; fill: #F5F5F4; }
    .foot { font: 500 11px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.4px; fill: #8A8A86; }
    .a { transform-box: fill-box; transform-origin: center; }
    .a1 { animation: d1 19s ease-in-out infinite alternate; }
    .a2 { animation: d2 23s ease-in-out infinite alternate; }
    .a3 { animation: d3 29s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(220px, 60px) scale(1.2) } }
    @keyframes d2 { to { transform: translate(-240px, -40px) scale(.85) } }
    @keyframes d3 { to { transform: translate(120px, -80px) scale(1.15) } }
    .phrase { opacity: 0; animation: show 12s infinite; }
    .p0 { opacity: 1; }
    .type { transform-box: fill-box; transform-origin: left; animation-duration: 12s; animation-iteration-count: infinite; }
    .t0 { animation-name: type0 } @keyframes type0 { 0% { transform: scaleX(0); animation-timing-function: steps(23) } 12%, 100% { transform: scaleX(1) } }
    .t1 { animation-name: type1 } @keyframes type1 { 0% { transform: scaleX(0); animation-timing-function: steps(32) } 12%, 100% { transform: scaleX(1) } }
    .t2 { animation-name: type2 } @keyframes type2 { 0% { transform: scaleX(0); animation-timing-function: steps(17) } 12%, 100% { transform: scaleX(1) } }
    .p1, .t1 { animation-delay: 4s } .p2, .t2 { animation-delay: 8s }
    @keyframes show { 0%, 30% { opacity: 1 } 33%, 100% { opacity: 0 } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .8 } 80%, 100% { transform: scale(3); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .a1, .a2, .a3, .ping, .phrase, .type { animation: none }
      .p1, .p2, .ping { opacity: 0 }
    }
  </style>
  <g clip-path="url(#card-dark)">
    <rect width="1200" height="520" fill="#08080A"/>
    <g filter="url(#blur-dark)" opacity="0.5">
      <circle cx="380" cy="420" r="210" fill="#FF5B22" class="a a1"/>
      <circle cx="820" cy="430" r="230" fill="#FF2E7E" class="a a2"/>
      <circle cx="610" cy="520" r="200" fill="#6A5BFF" class="a a3"/>
    </g>
    <rect width="1200" height="520" filter="url(#grain-dark)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="519" rx="23.5" fill="none" stroke="#1E1E21"/>
  <rect x="499" y="96" width="202" height="34" rx="17" fill="#08080A" fill-opacity=".6" stroke="#1E1E21"/>
  <circle cx="523" cy="113" r="4" fill="none" stroke="#3FB950" class="ping"/>
  <circle cx="523" cy="113" r="4" fill="#3FB950"/>
  <text x="537" y="117.5" class="pill">shipping rally</text>
  <text x="600" y="252" text-anchor="middle" class="name">Aryan Rao</text>
  <clipPath id="tc0-dark"><rect x="461.5" y="300" width="278.9" height="40" class="type t0"/></clipPath>
  <g clip-path="url(#tc0-dark)" class="phrase p0"><text x="461.5" y="326" class="typed">i ship the whole thing.</text></g>
  <clipPath id="tc1-dark"><rect x="407.4" y="300" width="387.3" height="40" class="type t1"/></clipPath>
  <g clip-path="url(#tc1-dark)" class="phrase p1"><text x="407.4" y="326" class="typed">app, site, backend, launch film.</text></g>
  <clipPath id="tc2-dark"><rect x="497.7" y="300" width="206.7" height="40" class="type t2"/></clipPath>
  <g clip-path="url(#tc2-dark)" class="phrase p2"><text x="497.7" y="326" class="typed">currently: rally.</text></g>
  <text x="600" y="462" text-anchor="middle" class="foot">PRODUCT ENGINEER  ·  IOS  ·  ANDROID  ·  WEB</text>
</svg>
