<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Aryan Rao — I build things people actually use.">
  <style>
    .name { font: 400 76px 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; letter-spacing: -2px; fill: #16140F; }
    .italic { font-style: italic; fill: #4F7A00; }
    .mono { font: 500 15px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .4px; fill: #6B675F; }
    .tag { font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2.4px; fill: #4F7A00; }
    .arc { fill: none; stroke: #CFC9BD; stroke-width: 1.5; stroke-dasharray: 2 7; stroke-linecap: round; }
    .rule { stroke: #E4DED2; stroke-width: 1; }
    .cursor { fill: #4F7A00; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect width="880" height="260" rx="18" fill="#FAF7F1"/>
  <path id="flight" class="arc" d="M 520 214 Q 690 -40 860 214"/>
  <g class="shuttle">
    <circle r="5" fill="#4F7A00">
      <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1">
        <mpath href="#flight"/>
      </animateMotion>
    </circle>
  </g>
  <text x="48" y="64" class="tag">@ARYKV · PRODUCT ENGINEER</text>
  <text x="44" y="146" class="name">Aryan <tspan class="italic">Rao</tspan></text>
  <line x1="48" y1="176" x2="832" y2="176" class="rule"/>
  <text x="48" y="214" class="mono">I build things people actually use.</text>
  <rect x="372" y="200" width="9" height="18" class="cursor"/>
</svg>
