<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake — arykv</title>
<meta name="description" content="Snake, played on a year of Aryan Rao's commits.">
<meta name="theme-color" content="#08080A">
<style>
  :root {
    --bg: #08080A; --ink: #F5F5F4; --mute: #8A8A86; --edge: #1E1E21;
    --l0: #141417; --l1: #3B1A10; --l2: #7A2E12; --l3: #C2410C; --l4: #FF5B22;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: grid; place-items: center; padding: 24px 16px;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  main { width: min(980px, 100%); display: grid; gap: 22px; }
  header, footer { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  a { color: var(--mute); text-decoration: none; font: 500 12px var(--mono); letter-spacing: .4px; }
  a:hover { color: var(--ink); }
  h1 { font-weight: 650; font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.04em; line-height: 1; }
  h1 span { color: var(--mute); font-weight: 400; }
  .score { font: 500 13px var(--mono); color: var(--mute); text-align: right; white-space: nowrap; }
  .score b { color: var(--ink); font-weight: 500; }
  .board { position: relative; border: 1px solid var(--edge); border-radius: 18px; padding: clamp(12px, 2.4vw, 22px); background: #0B0B0E; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .veil {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: color-mix(in srgb, var(--bg) 62%, transparent); border-radius: 18px;
    backdrop-filter: blur(2px); transition: opacity .2s; cursor: pointer;
  }
  .veil[hidden] { display: grid; opacity: 0; pointer-events: none; }
  .veil p { font: 500 13px var(--mono); color: var(--mute); margin-top: 10px; }
  .veil strong { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  footer { font: 400 12px var(--mono); color: var(--mute); }
  .key { display: inline-block; border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
  @media (max-width: 640px) { footer .hint-keys { display: none } }
</style>
</head>
<body>
<main>
  <a href="https://github.com/arykv">← github.com/arykv</a>
  <header>
    <h1>snake. <span>played on a year of commits.</span></h1>
    <div class="score">score <b id="score">0</b> &nbsp; best <b id="best">0</b></div>
  </header>
  <div class="board">
    <canvas id="c" aria-label="Snake on a contribution graph"></canvas>
    <div class="veil" id="veil"><div><strong id="title">eat the commits.</strong><p id="sub">arrows, wasd or swipe to start</p></div></div>
  </div>
  <footer>
    <span>each lit square is a real day of work. brighter is more.</span>
    <span class="hint-keys"><span class="key">space</span> pause</span>
  </footer>
</main>
<script>
(async () => {
  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const veil = document.getElementById('veil')
  const title = document.getElementById('title')
  const sub = document.getElementById('sub')
  const scoreEl = document.getElementById('score')
  const bestEl = document.getElementById('best')
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
  const LEVELS = ['--l0', '--l1', '--l2', '--l3', '--l4'].map(css)
  const INK = css('--ink')

  let source = []
  try { source = (await (await fetch('grid.json', { cache: 'no-store' })).json()).grid } catch {}
  if (!source.length) source = Array.from({ length: 53 }, () => Array(7).fill(0))

  // Wide screens play the graph as GitHub draws it; narrow ones turn it on its side.
  const portrait = () => innerWidth < 640
  let COLS, ROWS, board
  function layout() {
    const p = portrait()
    COLS = p ? 7 : source.length
    ROWS = p ? source.length : 7
    board = Array.from({ length: COLS }, (_, x) => Array.from({ length: ROWS }, (_, y) => (p ? source[y][x] : source[x][y]) || 0))
  }

  const store = { get: (k) => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } }
  let best = Number(store.get('snake-best')) || 0
  bestEl.textContent = best

  let snake, dir, queue, score, state, timer, cell, gap
  function reset() {
    layout()
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2)
    snake = portrait() ? [{ x: cx, y: cy }, { x: cx, y: cy + 1 }, { x: cx, y: cy + 2 }] : [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }]
    for (const s of snake) board[s.x][s.y] = 0
    dir = portrait() ? { x: 0, y: -1 } : { x: 1, y: 0 }
    queue = []
    score = 0
    scoreEl.textContent = 0
    state = 'ready'
    resize()
  }

  function resize() {
    const box = canvas.parentElement.getBoundingClientRect()
    const pad = parseFloat(getComputedStyle(canvas.parentElement).paddingLeft) * 2
    const w = box.width - pad
    gap = Math.max(1.5, Math.min(4, w / COLS / 5))
    cell = (w - gap * (COLS - 1)) / COLS
    const h = ROWS * cell + (ROWS - 1) * gap
    const dpr = devicePixelRatio || 1
    canvas.width = Math.round(w * dpr)
    canvas.height = Math.round(h * dpr)
    canvas.style.height = h + 'px'
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    draw()
  }

  function rr(x, y, s, r, color) {
    ctx.fillStyle = color
    ctx.beginPath()
    ctx.roundRect(x * (cell + gap), y * (cell + gap), s, s, r)
    ctx.fill()
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    const r = Math.min(4, cell * 0.22)
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) rr(x, y, cell, r, LEVELS[board[x][y]])
    snake.forEach((s, i) => {
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.35, 1 - i / (snake.length + 6))
      rr(s.x, s.y, cell, r, INK)
    })
    ctx.globalAlpha = 1
  }

  function lit() { for (const col of board) for (const v of col) if (v) return true; return false }
  function spawn() {
    const free = []
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if (!snake.some((s) => s.x === x && s.y === y)) free.push([x, y])
    const [x, y] = free[Math.floor(Math.random() * free.length)]
    board[x][y] = 4
  }

  function step() {
    if (queue.length) dir = queue.shift()
    const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS }
    if (snake.slice(0, -1).some((s) => s.x === head.x && s.y === head.y)) return over()
    snake.unshift(head)
    const v = board[head.x][head.y]
    if (v) {
      score += v
      scoreEl.textContent = score
      board[head.x][head.y] = 0
      if (!lit()) spawn()
    } else {
      snake.pop()
    }
    draw()
  }

  function run() {
    clearInterval(timer)
    timer = setInterval(step, portrait() ? 120 : 95)
    state = 'play'
    veil.hidden = true
  }
  function pause() {
    clearInterval(timer)
    state = 'paused'
    title.textContent = 'paused.'
    sub.textContent = 'space or tap to keep going'
    veil.hidden = false
  }
  function over() {
    clearInterval(timer)
    state = 'over'
    if (score > best) { best = score; store.set('snake-best', best); bestEl.textContent = best }
    title.textContent = `${score} commits eaten.`
    sub.textContent = 'press any arrow or tap to go again'
    veil.hidden = false
  }

  function turn(x, y) {
    if (state === 'over') { reset() }
    const last = queue.length ? queue[queue.length - 1] : dir
    if (last.x === -x && last.y === -y) { if (state !== 'play') run(); return }
    if (last.x === x && last.y === y) { if (state !== 'play') run(); return }
    if (queue.length < 3) queue.push({ x, y })
    if (state !== 'play') run()
  }

  const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }
  addEventListener('keydown', (e) => {
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase()]
    if (k) { e.preventDefault(); turn(...k) }
    else if (e.key === ' ') { e.preventDefault(); state === 'play' ? pause() : state === 'over' ? (reset(), run()) : run() }
  })

  let touch = null
  canvas.parentElement.addEventListener('touchstart', (e) => { touch = e.touches[0] }, { passive: true })
  canvas.parentElement.addEventListener('touchend', (e) => {
    if (!touch) return
    const t = e.changedTouches[0]
    const dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY
    touch = null
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy))
  })
  veil.addEventListener('click', () => { if (state === 'over') reset(); run() })

  let wasPortrait = portrait()
  addEventListener('resize', () => {
    if (portrait() !== wasPortrait) { wasPortrait = portrait(); clearInterval(timer); reset(); title.textContent = 'eat the commits.'; sub.textContent = 'arrows, wasd or swipe to start'; veil.hidden = false }
    else resize()
  })

  reset()
})()
</script>
</body>
</html>
